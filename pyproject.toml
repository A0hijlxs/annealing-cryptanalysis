[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "annealing-cryptanalysis"
version = "0.1.0"
description = "Statistical cryptanalysis toolkit: substitution, transposition and Vigenere cipher breaking"
readme = "README.md"
license = "MIT"
authors = [{ name = "A0hijlxs" }]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["src/codebreak"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "basic"

[tool.ruff]
line-length = 110

[tool.ruff.lint.per-file-ignores]
# marimo notebook cells: a trailing bare expression is the cell's display
# output (like Jupyter's implicit repr), not dead code.
"demo.py" = ["B018"]
